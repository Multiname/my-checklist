[project]
name = "my-checklist"
version = "0.1.0"
description = "Мобильное приложение для ведения чеклиста"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "flet==1.1.2",
]

[dependency-groups]
dev = [
    "flet-cli==1.1.2",
    "flet-desktop==1.1.2",
    "pytest==9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# src — код приложения, tests — общие фейки тестов (support.py).
pythonpath = ["src", "tests"]
# Кэш pytest отключён: в ограниченном режиме песочницы DSH его временные
# каталоги (0700) становятся недоступны процессу. См. docs/Environment.md.
addopts = "-p no:cacheprovider"

[tool.flet]
org = "com.blackline"
product = "My checklist"

# Приложение работает только с локальной БД: сеть и микрофон не нужны.
# `false` заставляет flet добавить в манифест tools:node="remove" — это
# убирает разрешение, даже если его добавит плагин.
[tool.flet.android.permission]
"android.permission.INTERNET" = false
"android.permission.RECORD_AUDIO" = false

[tool.flet.app]
path = "src"
